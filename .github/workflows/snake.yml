name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 12 小时更新一次
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake (HUD palette)
        uses: Platane/snk@v3
        with:
          github_user_name: eexin
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF&color_dots=%230A1620,%230B3A48,%230E6A80,%2300A6C8,%2300E5FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
